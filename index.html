<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lucky Spin - Mystery Reward</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --bg-dark: #09090b;
            --card-bg: #121216;
            --primary: #8b5cf6;
            --primary-glow: rgba(139, 92, 246, 0.4);
            --accent: #a855f7;
            --text-main: #f4f4f5;
            --text-muted: #a1a1aa;
            --border-color: rgba(255, 255, 255, 0.08);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(139, 92, 246, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(168, 85, 247, 0.08) 0%, transparent 40%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow-x: hidden;
        }

        .container {
            width: 100%;
            max-width: 420px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 28px 20px;
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
            position: relative;
        }

        .badge {
            display: inline-block;
            background: rgba(139, 92, 246, 0.15);
            color: #c4b5fd;
            border: 1px solid rgba(139, 92, 246, 0.3);
            padding: 6px 14px;
            border-radius: 99px;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.5px;
            margin-bottom: 12px;
            text-transform: uppercase;
        }

        h1 {
            font-size: 24px;
            font-weight: 800;
            margin-bottom: 6px;
            background: linear-gradient(to right, #ffffff, #c4b5fd);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p.subtitle {
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 28px;
        }

        /* Wheel Container */
        .wheel-wrapper {
            position: relative;
            width: 300px;
            height: 300px;
            margin: 0 auto 28px auto;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Outer Metallic/Neon Ring */
        .wheel-outer-ring {
            position: absolute;
            inset: -10px;
            border-radius: 50%;
            background: linear-gradient(145deg, #27272a, #18181b);
            box-shadow: 
                0 0 30px var(--primary-glow),
                inset 0 2px 4px rgba(255,255,255,0.1);
            border: 2px solid rgba(139, 92, 246, 0.4);
            z-index: 1;
        }

        /* Pointer / Jarum Penunjuk */
        .pointer {
            position: absolute;
            top: -18px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 20;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.6));
            transition: transform 0.1s ease;
        }

        .pointer svg {
            width: 34px;
            height: 40px;
        }

        canvas {
            position: relative;
            z-index: 5;
            border-radius: 50%;
            width: 100%;
            height: 100%;
        }

        /* Center Spin Button */
        .spin-btn {
            position: absolute;
            z-index: 15;
            width: 68px;
            height: 68px;
            border-radius: 50%;
            background: linear-gradient(135deg, #9333ea, #6d28d9);
            border: 4px solid #18181b;
            color: white;
            font-weight: 800;
            font-size: 14px;
            letter-spacing: 1px;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(139, 92, 246, 0.6), inset 0 2px 4px rgba(255,255,255,0.3);
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .spin-btn:hover:not(:disabled) {
            transform: scale(1.06);
            box-shadow: 0 0 28px rgba(139, 92, 246, 0.9);
        }

        .spin-btn:active:not(:disabled) {
            transform: scale(0.95);
        }

        .spin-btn:disabled {
            background: #27272a;
            color: #71717a;
            cursor: not-allowed;
            box-shadow: none;
        }

        /* Info Box */
        .status-bar {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
        }

        .status-bar span {
            color: var(--text-muted);
        }

        .status-bar strong {
            color: #c4b5fd;
            font-weight: 700;
        }

        /* Modal Result */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(6px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-card {
            background: #16161c;
            border: 1px solid rgba(139, 92, 246, 0.3);
            border-radius: 24px;
            padding: 28px 24px;
            width: 100%;
            max-width: 350px;
            text-align: center;
            transform: scale(0.9);
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: 0 20px 40px rgba(0,0,0,0.8);
        }

        .modal-overlay.active .modal-card {
            transform: scale(1);
        }

        .modal-icon {
            font-size: 48px;
            margin-bottom: 12px;
        }

        .modal-title {
            font-size: 20px;
            font-weight: 800;
            margin-bottom: 8px;
        }

        .modal-desc {
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 18px;
            line-height: 1.5;
        }

        .key-box {
            background: #09090b;
            border: 1px dashed #8b5cf6;
            padding: 12px;
            border-radius: 12px;
            font-family: monospace;
            font-size: 14px;
            color: #c4b5fd;
            margin-bottom: 18px;
            word-break: break-all;
            user-select: all;
            display: none;
        }

        .modal-btn {
            width: 100%;
            padding: 12px;
            border-radius: 12px;
            border: none;
            background: var(--primary);
            color: white;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .modal-btn:hover {
            background: #7c3aed;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="badge">Daily Event</div>
        <h1>Spin & Win Key</h1>
        <p class="subtitle">Putar roda dan menangkan akses key gratis</p>

        <div class="wheel-wrapper">
            <div class="wheel-outer-ring"></div>
            
            <!-- Jarum Penunjuk -->
            <div class="pointer" id="pointer">
                <svg viewBox="0 0 36 42" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M18 42L2 14C0.5 11.5 2.5 8 5.5 8H30.5C33.5 8 35.5 11.5 34 14L18 42Z" fill="#F4F4F5"/>
                    <circle cx="18" cy="13" r="5" fill="#8B5CF6"/>
                </svg>
            </div>

            <canvas id="wheelCanvas" width="600" height="600"></canvas>
            <button class="spin-btn" id="spinBtn">SPIN</button>
        </div>

        <div class="status-bar">
            <span>Kesempatan Tersisa</span>
            <strong id="spinCount">1x Putaran</strong>
        </div>
    </div>

    <!-- Modal Hasil -->
    <div class="modal-overlay" id="resultModal">
        <div class="modal-card">
            <div class="modal-icon" id="modalIcon">🎉</div>
            <div class="modal-title" id="modalTitle">Selamat!</div>
            <div class="modal-desc" id="modalDesc">Kamu mendapatkan hadiah spesial.</div>
            <div class="key-box" id="keyBox">NIELL-FREE-XXXX-XXXX</div>
            <button class="modal-btn" id="closeModalBtn">Tutup & Klaim</button>
        </div>
    </div>

    <script>
        // --- KONFIGURASI HADIAH ---
        // weight: semakin besar angka, semakin sering muncul (untuk simulasi frontend)
        const segments = [
            { label: 'ZONK', color: '#18181b', textColor: '#71717a', type: 'zonk', weight: 35 },
            { label: 'KEY 1 HARI', color: '#6d28d9', textColor: '#ffffff', type: 'win', keyDemo: 'KEY-1D-9823-VIP', weight: 15 },
            { label: 'COBA LAGI', color: '#27272a', textColor: '#a1a1aa', type: 'retry', weight: 20 },
            { label: 'KEY 3 HARI', color: '#8b5cf6', textColor: '#ffffff', type: 'win', keyDemo: 'KEY-3D-7741-PRO', weight: 5 },
            { label: 'ZONK', color: '#18181b', textColor: '#71717a', type: 'zonk', weight: 20 },
            { label: 'DISKON 50%', color: '#4c1d95', textColor: '#e9d5ff', type: 'win', keyDemo: 'VOUCHER-HEMAT50', weight: 5 }
        ];

        const canvas = document.getElementById('wheelCanvas');
        const ctx = canvas.getContext('2d');
        const spinBtn = document.getElementById('spinBtn');
        const pointer = document.getElementById('pointer');
        const spinCountEl = document.getElementById('spinCount');

        // Modal Elements
        const modal = document.getElementById('resultModal');
        const modalIcon = document.getElementById('modalIcon');
        const modalTitle = document.getElementById('modalTitle');
        const modalDesc = document.getElementById('modalDesc');
        const keyBox = document.getElementById('keyBox');
        const closeModalBtn = document.getElementById('closeModalBtn');

        const numSegments = segments.length;
        const arcSize = (2 * Math.PI) / numSegments;
        let currentRotation = 0; // dalam radian
        let isSpinning = false;
        let spinsLeft = 1;

        // Audio Context untuk efek suara detak roda (tanpa file mp3 eksternal)
        let audioCtx = null;
        function playTickSound() {
            try {
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(600, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(150, audioCtx.currentTime + 0.04);
                gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.04);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.04);
            } catch (e) {}
        }

        // Gambar Roda
        function drawWheel() {
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            const radius = canvas.width / 2;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            for (let i = 0; i < numSegments; i++) {
                const angle = currentRotation + i * arcSize;
                
                // Gambar potongan segmen
                ctx.beginPath();
                ctx.moveTo(centerX, centerY);
                ctx.arc(centerX, centerY, radius, angle, angle + arcSize);
                ctx.closePath();
                ctx.fillStyle = segments[i].color;
                ctx.fill();

                // Garis pemisah antar segmen
                ctx.lineWidth = 3;
                ctx.strokeStyle = '#09090b';
                ctx.stroke();

                // Gambar Teks
                ctx.save();
                ctx.translate(centerX, centerY);
                ctx.rotate(angle + arcSize / 2);
                ctx.textAlign = 'right';
                ctx.fillStyle = segments[i].textColor;
                ctx.font = '800 24px "Plus Jakarta Sans", sans-serif';
                ctx.fillText(segments[i].label, radius - 32, 8);
                ctx.restore();
            }
        }

        // Pilih pemenang berdasarkan bobot (weight)
        function getWeightedRandomIndex() {
            const totalWeight = segments.reduce((sum, item) => sum + item.weight, 0);
            let random = Math.random() * totalWeight;
            for (let i = 0; i < segments.length; i++) {
                if (random < segments[i].weight) return i;
                random -= segments[i].weight;
            }
            return 0;
        }

        // Animasi Putaran
        function spinWheel() {
            if (isSpinning || spinsLeft <= 0) return;
            
            isSpinning = true;
            spinBtn.disabled = true;

            const winningIndex = getWeightedRandomIndex();
            
            // Hitung sudut target agar berhenti tepat di tengah segmen pemenang
            // Jarum berada di posisi atas (-Math.PI / 2 atau 270 derajat)
            const extraSpins = 6 + Math.floor(Math.random() * 3); // 6-8 putaran penuh
            const segmentCenterAngle = winningIndex * arcSize + arcSize / 2;
            
            // Kalkulasi target rotasi absolut
            const targetAngle = (extraSpins * 2 * Math.PI) + (-Math.PI / 2 - segmentCenterAngle);
            
            // Tambahkan variasi acak sedikit di dalam segmen agar terlihat natural
            const randomOffset = (Math.random() - 0.5) * (arcSize * 0.6);
            const finalRotation = targetAngle + randomOffset;

            const startRotation = currentRotation % (2 * Math.PI);
            const totalChange = finalRotation - startRotation;
            const duration = 5000; // 5 detik
            let startTime = null;
            let lastSegmentPassed = -1;

            function animate(timestamp) {
                if (!startTime) startTime = timestamp;
                const elapsed = timestamp - startTime;
                const progress = Math.min(elapsed / duration, 1);

                // Easing: cubic-out (cepat di awal, melambat halus di akhir)
                const easeOut = 1 - Math.pow(1 - progress, 4);
                currentRotation = startRotation + totalChange * easeOut;

                drawWheel();

                // Deteksi pergantian segmen di jarum untuk bunyi tick & goyangan jarum
                const normalizedAngle = (currentRotation + Math.PI / 2) % (2 * Math.PI);
                const positiveAngle = normalizedAngle < 0 ? normalizedAngle + 2 * Math.PI : normalizedAngle;
                const currentSegment = Math.floor((2 * Math.PI - positiveAngle) / arcSize) % numSegments;

                if (currentSegment !== lastSegmentPassed) {
                    lastSegmentPassed = currentSegment;
                    playTickSound();
                    pointer.style.transform = 'translateX(-50%) rotate(-18deg)';
                    setTimeout(() => {
                        pointer.style.transform = 'translateX(-50%) rotate(0deg)';
                    }, 60);
                }

                if (progress < 1) {
                    requestAnimationFrame(animate);
                } else {
                    isSpinning = false;
                    handleResult(segments[winningIndex]);
                }
            }

            requestAnimationFrame(animate);
        }

        // Tampilkan Hasil
        function handleResult(prize) {
            if (prize.type === 'retry') {
                modalIcon.textContent = '🔄';
                modalTitle.textContent = 'Coba Lagi!';
                modalDesc.textContent = 'Belum beruntung, tapi kamu dapat kesempatan putar gratis 1x lagi!';
                keyBox.style.display = 'none';
                closeModalBtn.textContent = 'Putar Lagi';
                spinBtn.disabled = false;
            } else {
                spinsLeft--;
                spinCountEl.textContent = `${spinsLeft}x Putaran`;

                if (prize.type === 'win') {
                    modalIcon.textContent = '🎉';
                    modalTitle.textContent = `Dapat ${prize.label}!`;
                    modalDesc.textContent = 'Salin kode key di bawah ini sebelum menutup jendela:';
                    keyBox.textContent = prize.keyDemo;
                    keyBox.style.display = 'block';
                    closeModalBtn.textContent = 'Salin & Tutup';
                    
                    // Efek Confetti
                    confetti({
                        particleCount: 80,
                        spread: 70,
                        origin: { y: 0.6 },
                        colors: ['#8b5cf6', '#c4b5fd', '#ffffff']
                    });
                } else {
                    modalIcon.textContent = '💀';
                    modalTitle.textContent = 'Yah, Zonk!';
                    modalDesc.textContent = 'Belum rezeki hari ini, Bos. Coba lagi di kesempatan berikutnya!';
                    keyBox.style.display = 'none';
                    closeModalBtn.textContent = 'Oke, Mengerti';
                }
            }

            setTimeout(() => {
                modal.classList.add('active');
            }, 300);
        }

        // Event Listeners
        spinBtn.addEventListener('click', spinWheel);

        closeModalBtn.addEventListener('click', () => {
            if (keyBox.style.display === 'block') {
                navigator.clipboard.writeText(keyBox.textContent);
                alert('Key berhasil disalin ke clipboard!');
            }
            modal.classList.remove('active');
        });

        // Gambar roda pertama kali saat halaman dimuat
        drawWheel();
    </script>
</body>
</html>
